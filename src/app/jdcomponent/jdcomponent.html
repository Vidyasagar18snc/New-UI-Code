<div class="job-container">

  <h2>🧾 Job Description</h2>

  <!-- Row 1 -->
  <div class="row">
    <div class="form-group">
      <label>Job Title</label>
      <input type="text" [(ngModel)]="jobTitle" placeholder="e.g. Java Developer">
    </div>

    <div class="form-group">
      <label>Experience (Years)</label>
      <input type="number" [(ngModel)]="experience" placeholder="e.g. 2">
    </div>
  </div>

  <!-- Row 2 -->
  <div class="row">
    <div class="form-group">
      <label>Location</label>
      <input type="text" [(ngModel)]="location" placeholder="e.g. Bangalore">
    </div>
  </div>

  <!-- Skills -->
  <div class="form-group">
    <label>Required Skills</label>

    <div class="skill-input">
      <input type="text" [(ngModel)]="skillInput" placeholder="Add skill">
      <button type="button" (click)="addSkill()">Add</button>
    </div>

    <div class="skill-list">
      <span class="skill" *ngFor="let skill of skills; let i = index">
        {{ skill }}
        <button type="button" (click)="removeSkill(i)">✖</button>
      </span>
    </div>
  </div>

  <!-- Description -->
  <div class="form-group">
    <label>Job Description</label>
    <textarea rows="5" [(ngModel)]="description"
      placeholder="Enter detailed job description"></textarea>
  </div>

  <!-- Buttons -->
  <div class="action-buttons">
    <button class="cancel-btn">Cancel</button>

    <!-- ✅ FIX HERE -->
    <button class="submit-btn" (click)="submitJob()">
      Create Job
    </button>
  </div>

</div>
