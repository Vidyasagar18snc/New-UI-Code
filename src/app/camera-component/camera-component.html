<div class="login-container">

  <div class="login-card">

    <h2>Interview Panel Login</h2>

    <form (ngSubmit)="login()">

      <div class="form-group">
        <label>Email</label>

        <input
          type="email"
          [(ngModel)]="email"
          name="email"
          placeholder="Enter email"
          required
        />
      </div>

      <div class="form-group">
        <label>Password</label>

        <input
          type="password"
          [(ngModel)]="password"
          name="password"
          placeholder="Enter password"
          required
        />
      </div>

      <button type="submit">
        Login
      </button>

    </form>

    <p class="error" *ngIf="errorMessage">
      {{ errorMessage }}
    </p>

  </div>

</div>
